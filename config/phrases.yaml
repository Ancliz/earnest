  regex: '(?:make )?(.+?) (?:quieter|softer)(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
  relative: true
- id: media-volume-mute-26
  domain: media_player
  service: volume_mute
  regex: '(?:unmute|un mute)(?: (?:the )?(?:volume|audio|sound))?(?: (?:on |in |for )?(.+))?'
  device_group: 1
  body:
    is_volume_muted: false
- id: media-volume-mute-27
  domain: media_player
  service: volume_mute
  regex: '(?:mute|silence)(?: (?:the )?(?:volume|audio|sound))?(?: (?:on |in |for )?(.+))?'
  device_group: 1
  body:
    is_volume_muted: true
- id: media-media-play-28
  domain: media_player
  service: media_play
  regex: '(?:play|resume|unpause|continue)(?: (?:the )?(?:music|audio|playback))?(?: (?:on |in |for )?(.+))?'
  device_group: 1
  body: {}
- id: media-media-pause-29
  domain: media_player
  service: media_pause
  regex: '(?:pause|paus)(?: (?:the )?(?:music|audio|playback))?(?: (?:on |in |for )?(.+))?'
  device_group: 1
  body: {}
- id: media-media-stop-30
  domain: media_player
  service: media_stop
  regex: 'stop(?: (?:the )?(?:music|audio|playback))?(?: (?:on |in |for )?(.+))?'
  device_group: 1
  body: {}
- id: media-media-play-pause-31
  domain: media_player
  service: media_play_pause
  regex: '(?:toggle|play pause)(?: (?:the )?(?:music|audio|playback))?(?: (?:on |in |for )?(.+))?'
  device_group: 1
  body: {}
- id: media-media-next-track-32
  domain: media_player
  service: media_next_track
  regex: '(?:skip to (?:the )?next(?: (?:song|track))?|next(?: (?:song|track))?|skip(?: (?:this|the))?(?: (?:song|track))?)(?:
    (?:on |in |for )?(.+))?'
  device_group: 1
  body: {}
- id: media-media-previous-track-33
  domain: media_player
  service: media_previous_track
  regex: '(?:previous(?: (?:song|track))?|go back(?: (?:a|one) (?:song|track))?)(?: (?:on |in |for )?(.+))?'
  device_group: 1
  body: {}
- id: media-turn-on-34
