# Editable voice commands. Valid changes reload while the app is running.
# [optional words], (alternatives|here), and {device}/{volume}/{temperature}/{percent}/{mode}/{option}.
# The AdvantageAir policy reflects read-only diagnostics on 2026-10-26; keep installer settings intact.
version: 1
aliases:
  climate.ac:
  - air conditioner
  - air conditioning
  - air con
  - aircon
  - heating
  - cooling
  climate.ac_master_bed:
  - master bedroom
  - master bed
  climate.ac_alasdair_bed:
  - alasdair bedroom
  - alasdair bed
  climate.ac_craft_ldy:
  - craft room
  - laundry
  - craft and laundry
  climate.ac_tv_rump:
  - tv and rumpus
  - tv and rump
  - rumpus room
  - tv room
  climate.ac_diningliving:
  - dining and living
  - dining living
  - living room
  switch.ac_myfan:
  - my fan
  - automatic ac fan
# Services and devices are discovered from Home Assistant. Security, system, automation and
# helper domains are excluded by default; allow or exclude domains or domain.service names here.
voice_control:
  allow: []
  exclude: []
advantage_air:
  systems:
  - entity: climate.ac
    myzone_entity: select.ac_myzone
    zones:
    - climate.ac_master_bed
    - climate.ac_alasdair_bed
    - climate.ac_craft_ldy
    - climate.ac_tv_rump
    - climate.ac_diningliving
    constant_zones:
    - climate.ac_tv_rump
    minimum_open_zones: 1
    verified_preset: MyTemp
rules:
- id: speaker-volume
  domain: media_player
  service: volume_set
  phrases:
  - (set|change|adjust) [the] volume (of|on|for) [the] {device} (to|at) {volume}
  - (set|change|adjust) [the] {device} volume (to|at) {volume}
  body:
    volume_level: '{volume}'
- id: media-volume-set-1
  domain: media_player
  service: volume_set
  regex: (?:(?:set|change|adjust|turn|put) )?(?:the )?(?:volume|volum|volumn|volome) (?:of|on|for|in) (.+?) (?:to|at) (.+)
  device_group: 1
  value_group: 2
  value_type: volume
  body:
    volume_level: '{value}'
- id: media-volume-set-2
  domain: media_player
  service: volume_set
  regex: (?:(?:set|change|adjust|turn|put) )?(?:the )?(?:volume|volum|volumn|volome) (?:of|on|for|in) (.+) ([0-9]+(?:\.[0-9]+)?%?)
  device_group: 1
  value_group: 2
  value_type: volume
  body:
    volume_level: '{value}'
- id: media-volume-set-3
  domain: media_player
  service: volume_set
  regex: (?:(?:set|change|adjust|turn|put) )?(?:the )?(?:volume|volum|volumn|volome) (?:to |at )?(.+)
  value_group: 1
  value_type: volume
  body:
    volume_level: '{value}'
- id: media-volume-set-4
  domain: media_player
  service: volume_set
  regex: (?:(?:set|change|adjust|turn|put) )?(?:the )?(.+?) (?:volume|volum|volumn|volome) (?:to |at )?(.+)
  device_group: 1
  value_group: 2
  value_type: volume
  body:
    volume_level: '{value}'
- id: media-volume-set-5
  domain: media_player
  service: volume_set
  regex: (?:(?:set|change|adjust|turn|put) )?(?:the )?(?:volume|volum|volumn|volome) (?:to |at )?(.+?) (?:of|on|for|in) (.+)
  device_group: 2
  value_group: 1
  value_type: volume
  body:
    volume_level: '{value}'
- id: media-volume-set-6
  domain: media_player
  service: volume_set
  regex: (?:set|turn|adjust) (.+?) (?:volume )?to (.+)
  device_group: 1
  value_group: 2
  value_type: volume
  body:
    volume_level: '{value}'
- id: media-volume-set-7
  domain: media_player
  service: volume_set
  regex: (?:set|turn) (.+?) to (?:full|maximum|max) volume
  device_group: 1
  body:
    volume_level: 1
- id: media-volume-up-8
  domain: media_player
  service: volume_up
  regex: '(?:turn (?:the )?volume up|volume up|turn up|louder)(?: by (.+))?'
  value_group: 1
  value_type: volume
  body: {}
  relative: true
- id: media-volume-down-9
  domain: media_player
  service: volume_down
  regex: '(?:turn (?:the )?volume down|volume down|turn down|quieter)(?: by (.+))?'
  value_group: 1
  value_type: volume
  body: {}
  relative: true
- id: media-volume-up-10
  domain: media_player
  service: volume_up
  regex: '(?:raise|increase|boost|turn up) (?:the )?volume(?: by (.+))?'
  value_group: 1
  value_type: volume
  body: {}
  relative: true
- id: media-volume-down-11
  domain: media_player
  service: volume_down
  regex: '(?:lower|decrease|reduce|turn down) (?:the )?volume(?: by (.+))?'
  value_group: 1
  value_type: volume
  body: {}
  relative: true
- id: media-volume-up-12
  domain: media_player
  service: volume_up
  regex: 'volume up (?:on |in |for )?(.+?)(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
  relative: true
- id: media-volume-down-13
  domain: media_player
  service: volume_down
  regex: 'volume down (?:on |in |for )?(.+?)(?: by (.+))?'
