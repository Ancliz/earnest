- id: media-volume-down-19
  domain: media_player
  service: volume_down
  regex: 'turn (?:the )?(?:volume )?down(?: )?(?:on |in |for )?(.+?)(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
