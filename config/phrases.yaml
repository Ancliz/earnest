  service: turn_on
  regex: (?:turn|switch|power) (.+) on
  device_group: 1
  body: {}
- id: media-turn-off-37
  domain: media_player
  service: turn_off
  regex: (?:turn|switch|power) (.+) off
  device_group: 1
  body: {}
- id: media-media-pause-38
  domain: media_player
  service: media_pause
  regex: (.+?) (?:pause|paus)
  device_group: 1
  body: {}
- id: media-media-play-39
  domain: media_player
  service: media_play
  regex: (.+?) (?:play|resume)
  device_group: 1
  body: {}
- id: media-volume-mute-40
  domain: media_player
  service: volume_mute
  regex: (.+?) unmute
  device_group: 1
  body:
    is_volume_muted: false
- id: media-volume-mute-41
  domain: media_player
  service: volume_mute
  regex: (.+?) mute
  device_group: 1
  body:
    is_volume_muted: true
- id: climate-temperature
  domain: climate
  service: set_temperature
  phrases:
  - (set|change|adjust) [the] (temperature|temp) (of|on|for|in) {device} (to|at) {temperature}
  - (set|change|adjust) [the] {device} temperature (to|at) {temperature}
  - (set|change) {device} to {temperature} degrees
  - make {device} {temperature} degrees
  - (set|change) [the] (ac|air con) [temperature] (in|for) [the] {device} to {temperature}
  body:
    temperature: '{temperature}'
- id: climate-cool
  domain: climate
  service: set_hvac_mode
  phrases:
  - (cool|start cooling) [the] {device}
  - (set|change) {device} [mode] to (cool|cooling)
  body:
    hvac_mode: cool
- id: climate-heat
  domain: climate
  service: set_hvac_mode
  phrases:
  - (heat|start heating) [the] {device}
  - (set|change) {device} [mode] to (heat|heating)
  - change to (heat|heating)
  body:
    hvac_mode: heat
- id: climate-fan-only
  domain: climate
  service: set_hvac_mode
  phrases:
  - (set|change) {device} [mode] to fan only
  body:
    hvac_mode: fan_only
- id: climate-dry
  domain: climate
  service: set_hvac_mode
  phrases:
  - (set|change) {device} [mode] to dry
  body:
    hvac_mode: dry
- id: climate-fan
  domain: climate
  service: set_fan_mode
  phrases:
  - (set|change) [the] fan speed (on|of|for) {device} to {mode}
  - (set|change) [the] {device} fan [speed] to {mode}
  body:
    fan_mode: '{mode}'
  values:
    automatic: auto
    slow: low
    fast: high
- id: climate-on
  domain: climate
  service: turn_on
  phrases:
  - (turn|switch|power) on [the] {device}
  - (turn|switch|power) [the] {device} on
  - (turn|switch) on [the] (ac|air con|air conditioning) (in|for) [the] {device}
  body: {}
- id: climate-off
  domain: climate
  service: turn_off
  phrases:
  - (turn|switch|power) off [the] {device}
  - (turn|switch|power) [the] {device} off
  body: {}
- id: light-on
  domain: light
  service: turn_on
  phrases:
  - (turn|switch|power) on [the] {device}
  - (turn|switch|power) [the] {device} on
  body: {}
- id: light-off
  domain: light
  service: turn_off
  phrases:
  - (turn|switch|power) off [the] {device}
  - (turn|switch|power) [the] {device} off
  body: {}
- id: switch-on
  domain: switch
  service: turn_on
  phrases:
  - (turn|switch|power) on [the] {device}
  - (turn|switch|power) [the] {device} on
  body: {}
- id: switch-off
  domain: switch
  service: turn_off
  phrases:
  - (turn|switch|power) off [the] {device}
  - (turn|switch|power) [the] {device} off
  body: {}
- id: fan-on
  domain: fan
  service: turn_on
  phrases:
  - (turn|switch|power) on [the] {device}
  - (turn|switch|power) [the] {device} on
  body: {}
- id: fan-off
  domain: fan
  service: turn_off
  phrases:
  - (turn|switch|power) off [the] {device}
  - (turn|switch|power) [the] {device} off
  body: {}
- id: light-brightness
  domain: light
  service: turn_on
  phrases:
  - (set|change) [the] brightness (of|on|for) {device} to {percent}
  - (set|change) [the] {device} brightness to {percent}
  body:
    brightness_pct: '{percent}'
- id: fan-percentage
  domain: fan
  service: set_percentage
  phrases:
  - (set|change) [the] speed (of|on|for) {device} to {percent}
  - (set|change) [the] {device} speed to {percent}
  body:
    percentage: '{percent}'
