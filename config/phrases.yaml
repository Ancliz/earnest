  service: turn_on
  regex: '(?:turn|switch|power) on(?: (.+))?'
  device_group: 1
  body: {}
- id: media-turn-off-35
  domain: media_player
  service: turn_off
  regex: '(?:turn|switch|power) off(?: (.+))?'
  device_group: 1
