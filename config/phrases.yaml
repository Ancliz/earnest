- id: media-volume-down-17
  domain: media_player
  service: volume_down
  regex: '(?:lower|decrease|reduce) (?:the )?(.+?) volume(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
  relative: true
- id: media-volume-up-18
  domain: media_player
  service: volume_up
  regex: 'turn (?:the )?(?:volume )?up(?: )?(?:on |in |for )?(.+?)(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
