- id: media-volume-up-20
  domain: media_player
  service: volume_up
  regex: 'turn (.+?) volume up(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
  relative: true
- id: media-volume-down-21
  domain: media_player
  service: volume_down
  regex: 'turn (.+?) volume down(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
  relative: true
- id: media-volume-up-22
  domain: media_player
  service: volume_up
  regex: 'turn (.+?) up(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
  relative: true
- id: media-volume-down-23
  domain: media_player
  service: volume_down
  regex: 'turn (.+?) down(?: by (.+))?'
  device_group: 1
  value_group: 2
  value_type: volume
  body: {}
