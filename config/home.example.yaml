#   systems:
#   - entity: climate.ac
#     myzone_entity: select.ac_myzone
#     zones:
#     - climate.ac_zone_1
#     - climate.ac_zone_2
#     constant_zones:
#     - climate.ac_zone_1
#     minimum_open_zones: 1
#     verified_preset: MyTemp